<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Уголки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Sawarabi+Gothic&display=swap">
<style>
/* Layout: header row, then the framed board on the left and a 392px column of cards on the right; stacks on phones */
:root{
  --bg:#f5eed9; --card:#fcf9f1; --line:#d5cfbe; --ink:#000; --text:#575757; --muted:#9c9c9c;
  --frame:#e8c78a; --frame-ink:#865931; --sq-light:#e8d3ad; --sq-dark:#a8774b; --sq-ink:#3f2c09; --veil:rgba(245,238,217,.6); --ring:#d99a1e; --yellow:#ffca57; --hint:#efece5; --disabled:#ccc4b1; --six:#4c8810; --danger:#c0392b;
  --f-head:"Sawarabi Gothic","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-lbl:Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-mono);font-weight:500;font-size:14px;line-height:1.43;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.head-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;background:transparent}
.icon-btn img{display:block;width:20px;height:20px}
.icon-btn[aria-expanded="true"]{border-color:#000}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--card);border:1px solid #000;border-radius:16px;padding:8px;box-shadow:0 3px 11px -2px rgba(0,0,0,.25)}
.menu-item{display:block;width:100%;border:0;border-radius:10px;padding:16px 17px;text-align:left;white-space:nowrap}
h1{font-family:var(--f-head);font-weight:400;font-size:24px;line-height:26px;letter-spacing:-.03em;margin:0}
.sub{margin:2px 0 0;font-size:12px;line-height:19px;color:var(--text);text-transform:uppercase}
.game{display:flex;gap:15px;align-items:flex-start;justify-content:center}

/* board */
.board-box{flex:1 1 533px;min-width:0;max-width:533px;display:flex;flex-direction:column;align-items:center;gap:16px}
.frame{width:100%;background:var(--frame);border-radius:16px;display:grid;grid-template-columns:14.33px minmax(0,1fr) 14.33px;grid-template-rows:14.33px auto 14.33px}
.lbl{display:flex;font:700 8.6px var(--f-lbl);color:var(--frame-ink);text-transform:uppercase}
.lbl span{flex:1;display:flex;align-items:center;justify-content:center}
.lbl.files{grid-column:2}
.lbl.ranks{flex-direction:column}
.board{grid-column:2;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;
  border:1.43px solid var(--frame-ink);border-radius:10px;overflow:hidden}
.sq{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;--mark:#fcf9f1}
.sq.l{background-color:var(--sq-light);--mark:var(--sq-ink)}
.sq.inner{background-image:linear-gradient(var(--veil),var(--veil))} .sq.d{background-color:var(--sq-dark)}
.sq.home::before{content:"";position:absolute;inset:12%;border-radius:6px;background:color-mix(in srgb,var(--tint) 60%,transparent);border:2px dashed rgba(0,0,0,.45);z-index:1}
.sq.start::before{inset:6%;border-style:solid;border-width:3px}
.sq.place-hint::before{content:"";position:absolute;inset:6%;border-radius:8px;border:2px dashed var(--mark);z-index:1}
.sq.can-place{cursor:pointer}
.sq.can-place::before{border:3px solid var(--yellow);animation:glow 1.1s infinite}
@keyframes glow{50%{border-color:transparent}}
.sq.dest{cursor:pointer}
.sq.dest::after{content:"";position:absolute;width:24%;height:24%;border-radius:50%;background:var(--yellow);border:1px solid #000;z-index:3;
  transition:width .22s cubic-bezier(.2,.8,.3,1),height .22s cubic-bezier(.2,.8,.3,1),background-color .22s ease,border-width .22s ease}
.sq.dest:focus-visible::after{width:74%;height:74%;background:color-mix(in srgb,var(--yellow) 45%,transparent);border-width:2px}
.sq.dest:focus-visible{outline:none}
.pc{width:72%;aspect-ratio:1;border-radius:50%;background:var(--fill);border:3px solid var(--edge);position:relative;z-index:2;flex:none;
  box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 -4px 0 rgba(0,0,0,.15);transition:transform .12s}
.pc::after{content:"";position:absolute;inset:22%;border-radius:50%;border:2px solid var(--edge);opacity:.45}
.sq.pair .pc{width:50%;margin:0 -6%}
.pc.can{cursor:pointer;outline:3px solid var(--ring);outline-offset:2px;animation:pulse 1.1s infinite}
.pc.sel{outline:4px solid var(--ring);outline-offset:2px;animation:none;transform:translateY(-3px)}
@keyframes pulse{50%{outline-color:transparent}}
/* reserves under the board: yours on the left (big, clickable), everyone else on the right (mini) */
.tray{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px 24px;flex-wrap:wrap;min-height:48px}
.tray:empty{display:none}
.tray-mine{display:flex;align-items:center;gap:12px}
.tray-lab{font-size:12px;line-height:18px;color:var(--text);text-transform:uppercase}
.slots{display:flex;gap:12px;align-items:center}
.tray .pc{width:44px}
.slot{width:44px;aspect-ratio:1;border-radius:50%;border:1.5px dashed rgba(0,0,0,.28);flex:none}
.tray-others{display:flex;flex-direction:column;gap:6px}
.orow{display:flex;align-items:center;gap:8px}
.orow .nm{width:10ch;text-align:right;font-size:12px;line-height:18px;color:var(--text);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .slots{gap:4px}
.mini{width:18px;height:18px;border-radius:50%;background:var(--fill);border:2px solid var(--edge);box-shadow:0 1px 0 rgba(0,0,0,.3);flex:none}
.mini.out{background:transparent;border:1.5px dashed rgba(0,0,0,.28);box-shadow:none}
/* when yours and the opponents' reserves don't fit side by side under the board, stack them:
   smaller own pieces, labels in one shared column so every row starts at the same line */
.board-box{container-type:inline-size}
@container (max-width:460px){
  /* narrow: your pieces on one line, then all opponents flow side by side in a wrapping line to save height */
  .tray{flex-direction:column;align-items:flex-start;gap:12px}
  .tray-mine{gap:12px}
  .tray-mine .slots{gap:8px}.tray .pc,.tray .slot{width:32px}.tray .pc{border-width:2.5px}
  .tray-others{flex-direction:row;flex-wrap:wrap;gap:8px 18px}
  .orow .nm{width:auto;max-width:10ch;text-align:left}}

/* side column */
.side{flex:0 1 392px;min-width:300px;max-width:392px;display:flex;flex-direction:column;gap:12px}
.side-inner{display:flex;flex-direction:column;gap:12px}
.side-inner:empty{display:none}
/* chat (games with friends): built once and only its message list is refreshed, so typing is never interrupted */
.chat{gap:12px}
.chat-list{list-style:none;margin:0;padding:0 2px 0 0;display:flex;flex-direction:column;gap:10px;max-height:240px;overflow-y:auto}
.chat-empty{font-size:12px;line-height:18px;color:var(--muted);text-transform:uppercase}
.msg{display:flex;flex-direction:column;gap:2px}
.msg-head{display:flex;align-items:center;gap:6px;font-size:12px;line-height:18px;text-transform:uppercase;color:var(--text)}
.msg-head .ico{--s:14px;border-width:2px}
.msg-time{margin-left:auto;color:var(--muted)}
.msg-text{font-size:14px;line-height:20px;color:#000;overflow-wrap:anywhere;padding-left:20px}
.chat-form{display:flex;gap:8px;align-items:center}
.chat-form input{flex:1;min-width:0;height:42px}
#chatInput{text-transform:none}
#chatInput::placeholder{text-transform:uppercase}
.chat-form .chat-send{width:42px;height:42px;padding:0;flex:none;font-size:18px;line-height:1}
.emoji-wrap{position:relative;flex:none}
.emoji-btn{font-size:18px;line-height:1}
.emoji-pop{position:absolute;right:0;bottom:calc(100% + 6px);z-index:20;background:var(--card);border:1px solid #000;border-radius:16px;padding:8px;box-shadow:0 3px 11px -2px rgba(0,0,0,.25);display:grid;grid-template-columns:repeat(6,36px);gap:4px}
.emoji-pop button{width:36px;height:36px;padding:0;border:0;border-radius:10px;font-size:20px;line-height:1;text-transform:none}
@media (pointer:coarse){.emoji-wrap{display:none}}
.chat-btn{position:relative}
.badge{position:absolute;left:22px;top:5.5px;min-width:14px;height:14px;padding:0 2px;border-radius:99px;background:var(--yellow);color:#000;font:600 8px/14px var(--f-mono);letter-spacing:-.04em;text-align:center}
.chat-head{display:flex;align-items:center;justify-content:space-between}
.chat-close{display:none;border:0;padding:0;width:32px;height:32px;font-size:24px;line-height:1;text-transform:none}
.sheet-backdrop{position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.25)}
/* phones: the chat leaves the column and becomes a sheet opened from the header button */
@media (max-width:680px){
  .chat-btn:not([hidden]){display:flex}
  .chat{position:fixed;left:0;right:0;bottom:0;z-index:40;max-height:75vh;margin:0;border-radius:16px 16px 0 0;border:1px solid #000;border-bottom:0;background:var(--card);
    padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    box-shadow:0 -6px 24px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.3,1);visibility:hidden}
  .chat.open{transform:none;visibility:visible}
  .chat-list{max-height:none;flex:1 1 auto;min-height:0}
  .chat-close{display:block}
}
@media (min-width:681px){.chat-btn{display:none!important}.sheet-backdrop{display:none!important}}
 /* phones have their own emoji keyboard */
.card{border:1px solid var(--line);border-radius:16px;padding:16px 25px;display:flex;flex-direction:column;gap:16px}
.card.main{background:var(--card);padding:24px 25px;gap:24px}
.card.turn-card{background:var(--card);border:2px solid #000;padding:20px 25px;gap:24px}
/* someone else's turn: the card calms down, the black frame is only for you */
.card.turn-card.calm{border:1px solid #b1b1b1;padding:21px 26px}
.card-title{font-family:var(--f-head);font-weight:400;font-size:24px;line-height:26px;letter-spacing:-.03em;margin:0}
.card-sub{font-family:var(--f-head);font-weight:400;font-size:18px;line-height:24px;letter-spacing:-.03em;margin:0}
.rule{height:1px;background:var(--line);border:0;margin:0}
.rows{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:20px}
.row .lab{width:76px;flex:none;color:var(--text);text-transform:uppercase;line-height:20px}
.seg{display:flex;gap:10px;flex-wrap:nowrap}
/* when the card is too narrow for label + buttons in one line, every row puts its label on top, all at once */
.card.main{container-type:inline-size}
@container (max-width:334px){.row{flex-direction:column;align-items:stretch;gap:8px}.row .lab{width:auto}.row .seg{align-self:flex-start}}
button{font:inherit;cursor:pointer;color:#000;background:transparent;border:1px solid #000;border-radius:12px;padding:8px 18px;line-height:24px;text-transform:uppercase;transition:background-color .12s,color .12s}
button[aria-pressed="true"]{background:#000;color:#fff}
button:not(:disabled):active{transform:translateY(1px)}
/* hover tints only where there is a real pointer; on phones a tap would otherwise leave them stuck */
@media (hover:hover) and (pointer:fine){
  .pc.can:hover{transform:translateY(-3px)}
  button:not(:disabled):hover{background:rgba(0,0,0,.06)}
  button[aria-pressed="true"]:hover{background:#2b2b2b}
  .btn-main:not(:disabled):hover{background:#ffbd2e}
  input[type="text"]:hover{background:rgba(0,0,0,.03)}
  details.card summary:hover .chev{opacity:.6}
  .linkbtn:hover{opacity:1;background:transparent}
  .tray .pc.can:hover,.pc.can:hover{transform:translateY(-3px)}
  .sq.can-place:hover::before{background:color-mix(in srgb,var(--yellow) 35%,transparent)}
  .sq.dest:hover::after{width:74%;height:74%;background:color-mix(in srgb,var(--yellow) 45%,transparent);border-width:2px}
}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.btn-main{background:var(--yellow);width:100%;padding:8px 42px}
.btn-main:disabled{background:var(--disabled);opacity:.4;cursor:default}
input[type="text"]{font:inherit;text-transform:uppercase;color:#000;background:transparent;border:1px solid #000;border-radius:12px;padding:8px 18px;line-height:24px;width:100%;min-width:0;transition:background-color .12s}
input[type="text"]::placeholder{color:rgba(0,0,0,.37)}
.note{font-size:12px;line-height:18px;color:var(--text);text-transform:uppercase;text-align:center;margin:0}
.err{font-size:12px;line-height:18px;color:var(--danger);text-transform:uppercase;margin:0}
.stack{display:flex;flex-direction:column;gap:12px}

.turn{display:flex;align-items:center;gap:11px;font-family:var(--f-head);font-size:20px;line-height:24px;letter-spacing:-.03em}
.ico{width:var(--s,20px);height:var(--s,20px);border-radius:50%;background:var(--fill);border:3px solid var(--edge);flex:none;box-shadow:0 1px 0 rgba(0,0,0,.3)}
.dice-row{display:flex;gap:12px;align-items:center}
.die{width:66px;height:66px;flex:none;border:1px solid #000;border-radius:16px;background:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.16);
  display:grid;grid-template:repeat(3,11px)/repeat(3,11px);gap:6px;place-content:center;padding-bottom:4px}
.die i{width:11px;height:11px;border-radius:50%;background:#000;visibility:hidden}
.die i.on{visibility:visible}
.die.six{border-color:var(--six)} .die.six i{background:var(--six)}
.die.rolling{animation:shake .8s}
@keyframes shake{20%{transform:rotate(-14deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
.dice-row .btn-main{height:66px;flex:1;min-width:0;padding-inline:12px}
.hint{background:var(--hint);border-radius:10px;padding:12px;font-size:12px;line-height:18px;color:var(--text);text-transform:uppercase}
.hint b{color:#000;font-weight:500}
.dice-stack{display:flex;flex-direction:column;gap:13px}

.players{display:flex;flex-direction:column;gap:12px}
.prow{display:flex;align-items:center;gap:8px;font-size:12px;line-height:18px;text-transform:uppercase;color:var(--text)}
.prow .nm{min-width:50px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.active .nm{color:#000;text-decoration:underline 1.5px var(--yellow);text-underline-offset:3px}
.prow .st{flex:1;text-align:right;color:var(--muted);white-space:nowrap}
.prow .place{color:#000}
.prow .free{color:var(--muted)}

details.card{gap:0}
details.card summary{list-style:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-family:var(--f-head);font-size:18px;line-height:24px;letter-spacing:-.03em}
details.card summary::-webkit-details-marker{display:none}
details.card summary .chev{width:24px;height:24px;background:url(assets/chevron.svg) center/contain no-repeat;transition:transform .15s}
details.card[open] summary .chev{transform:scaleY(-1)}
details.card[open] summary{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.goal{margin:0 0 12px;color:var(--text);text-transform:uppercase;line-height:20px}
.rules{margin:0;padding-left:21px;gap:8px;color:var(--text);text-transform:uppercase;line-height:20px;display:flex;flex-direction:column}
.log{margin:0;padding:0;list-style:none;font-size:12px;line-height:18px;color:var(--text);text-transform:uppercase;display:flex;flex-direction:column;gap:4px;max-height:200px;overflow:auto}
.log li:first-child{color:#000}
.result-card{background:var(--card);border:2px solid #000;padding:20px 25px;gap:20px}
.result-card.win{border-color:var(--six)}
.result-title{display:block;margin:0}
.result-card .prow .st{color:var(--text)}
.big{font-family:var(--f-head);font-size:32px;line-height:36px}
.invite{display:flex;gap:8px;flex-wrap:wrap}
.invite input{flex:1 1 180px;text-transform:none;font-size:12px}
.linkbtn{border:0;padding:9px;opacity:.62;font-size:12px}
/* side by side down to 680px (the board shrinks first); below that the column drops under the board and both stretch full width */
@media (max-width:680px){.game{flex-direction:column;align-items:stretch}.board-box,.side{max-width:none;min-width:0;flex:none;width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Уголки</h1><p class="sub">Дедушкина игра на шахматной доске</p></div>
    <div class="head-actions">
      <button class="icon-btn" id="soundBtn" type="button"><img id="soundIco" src="assets/sound-on.svg" width="20" height="20" alt=""></button>
      <button class="icon-btn chat-btn" id="chatBtn" type="button" aria-label="Чат" aria-controls="chat" aria-expanded="false" hidden><img src="assets/chat.svg" width="20" height="20" alt=""><span class="badge" id="chatBadge" hidden></span></button>
      <div class="menu-wrap" id="menuWrap" hidden>
        <button class="icon-btn" id="menuBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" aria-label="Меню"><img src="assets/menu-dots.svg" width="20" height="20" alt=""></button>
        <div class="menu" id="menu" role="menu" hidden><button class="menu-item" id="topNew" type="button" role="menuitem">Начать новую игру</button></div>
      </div>
    </div>
  </header>
  <div class="game">
    <div class="board-box">
      <div class="frame">
        <span></span><div class="lbl files"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div><span></span>
        <div class="lbl ranks"><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span></div>
        <div class="board" id="board"></div>
        <div class="lbl ranks"><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span></div>
        <span></span><div class="lbl files"><span>a</span><span>b</span><span>c</span><span>d</span><span>e</span><span>f</span><span>g</span><span>h</span></div><span></span>
      </div>
      <div class="tray" id="tray" aria-label="Твои фишки вне поля"></div>
    </div>
    <div class="side">
      <div class="side-inner" id="side"></div>
      <section class="card chat" id="chat" hidden aria-label="Чат">
        <div class="chat-head"><p class="card-sub">Чат</p><button type="button" class="chat-close" id="chatClose" aria-label="Закрыть чат">×</button></div>
        <ul class="chat-list" id="chatList" aria-live="polite"></ul>
        <form class="chat-form" id="chatForm" autocomplete="off">
          <input type="text" id="chatInput" maxlength="300" placeholder="Напиши сообщение" aria-label="Сообщение">
          <div class="emoji-wrap">
            <button type="button" class="icon-btn emoji-btn" id="emojiBtn" aria-label="Эмодзи" aria-expanded="false">🙂</button>
            <div class="emoji-pop" id="emojiPop" hidden></div>
          </div>
          <button type="submit" class="btn-main chat-send" id="chatSend" aria-label="Отправить" disabled>→</button>
        </form>
      </section>
      <div class="side-inner" id="sideRest"></div>
    </div>
    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  </div>
</div>
<script>
const FILES='abcdefgh';
const CORNERS=['a1','a8','h8','h1'];
const CORNER_XY=[[0,0],[0,7],[7,7],[7,0]];
const CORNER_RING=[0,7,14,21];
// Clockwise ring around the edge, starting at a1: up the a-file, along rank 8, down the h-file, back along rank 1.
const RING=[];
for(let y=0;y<8;y++)RING.push([0,y]);
for(let x=1;x<8;x++)RING.push([x,7]);
for(let y=6;y>=0;y--)RING.push([7,y]);
for(let x=6;x>=1;x--)RING.push([x,0]);
const RING_KEYS=new Set(RING.map(c=>c+''));
function diag(c){const[cx,cy]=CORNER_XY[c];const dx=cx?-1:1,dy=cy?-1:1;return[1,2,3].map(k=>[cx+dx*k,cy+dy*k]);}
// Path index: 0 = own corner (start), 1..27 = edge, 28 = own corner again (home), 29..31 = diagonal toward centre.
function cellAt(corner,i){return i<=28?RING[(CORNER_RING[corner]+i)%28]:diag(corner)[i-29];}
const key=c=>c[0]+','+c[1];
const cname=c=>FILES[c[0]]+(c[1]+1);

const COLORS=[
  {name:'белые',fill:'#f3efe6',edge:'#3b2f25',tint:'#fff'},
  {name:'чёрные',fill:'#2a2522',edge:'#d6ccbb',tint:'#2a2522'},
  {name:'красные',fill:'#c6412f',edge:'#5a1a10',tint:'#c6412f'},

/* ---------- rules ---------- */
let G=null,SEL=null,screen='home';
function occupants(k,pi){
  // Pieces standing on a cell. A piece waiting on its own corner after the lap still blocks everyone;
  // only players who have filled their whole corner drop out of the way.
  const r=[];
  G.players.forEach((P,j)=>{
    if(j!==pi&&finished(P))return;
    P.pieces.forEach((pos,n)=>{if(pos>=0&&key(cellAt(P.corner,pos))===k)r.push({j,n});});
  });
  return r;
}
function freeCorners(){const taken=G.players.map(P=>P.corner);return[0,1,2,3].filter(c=>!taken.includes(c));}
function optionsFor(pi,r){
  const P=G.players[pi],opts=[];
  P.pieces.forEach((p,n)=>{
    if(p<0)return; const t=p+r; if(t>31)return;
    for(let s=p+1;s<t;s++) if(occupants(key(cellAt(P.corner,s)),pi).length) return; // no jumping over anyone
    const occ=occupants(key(cellAt(P.corner,t)),pi);
    if(occ.some(o=>o.j===pi))return; // can't take your own
    opts.push({type:'move',n,from:p,to:t,cap:occ});
  });
  if(r===6&&P.pieces.includes(-1)){
    // the first six lets you pick any free corner; after that it's always your own
    (P.corner==null?freeCorners():[P.corner]).forEach(c=>{
      const occ=occupants(key(CORNER_XY[c]),pi);
      if(!occ.some(o=>o.j===pi)) opts.push({type:'place',n:P.pieces.indexOf(-1),corner:c,cap:occ});
    });
  }
  return opts;
}
const finished=P=>P.pieces.every(p=>p>=28);
// a piece is settled when it reached the deepest free cell of its corner: every cell beyond it (up to d4) is already taken by its own pieces
const settled=(P,pos)=>{if(pos<28)return false;for(let q=pos+1;q<=31;q++)if(!P.pieces.includes(q))return false;return true;};
const cur=()=>G.players[G.turn];
const who=P=>P.name||COLORS[P.color].name;
const isMine=()=>G&&G.phase!=='over'&&(NET?G.turn===NET.seat:!cur().bot);

/* ---------- flow ---------- */
function makeState(list){
  const players=list.map((p,i)=>({color:i,corner:null,bot:!!p.bot,name:p.name,pieces:[-1,-1,-1,-1]}));
  const g={players,turn:0,phase:'roll',roll:null,rollSeq:0,options:[],places:[],log:[],note:'',again:false};
  g.log.unshift(`Игра началась. Первым ходит ${who(players[0])}.`);
  return g;
}
function newLocalGame(name,bots){
  const list=[{name:name||'Ты',bot:false}];
  for(let i=1;i<=bots;i++)list.push({name:bots>1?`Бот ${i}`:'Бот',bot:true});
  NET=null;G=makeState(list);screen='game';SEL=null;
  render();maybeBot();
}
function addLog(t){G.log.unshift(t);G.log=G.log.slice(0,40);}
function nextTurn(){
  const n=G.players.length,was=G.turn;
  do{G.turn=(G.turn+1)%n;}while(G.places.includes(G.turn));
  G.again=false;
  // with bots: a little chime when the turn comes back to you (online this is handled in remoteSounds)
  if(!NET&&G.players[was].bot&&!cur().bot)sfx('turn');
}
function capture(list){
  list.forEach(o=>{G.players[o.j].pieces[o.n]=-1;addLog(`${who(cur())} рубит фишку: ${who(G.players[o.j])}.`);});
}
async function doRoll(forced){
  if(!G||G.phase!=='roll')return;
  acting=true;
  try{
    G.phase='busy';G.note='';SEL=null;G.rollStart=(G.rollStart||0)+1;sync();
    const r=forced||1+Math.floor(Math.random()*6);
    await animateDie(r);
    G.roll=r;G.rollSeq=(G.rollSeq||0)+1;G.options=optionsFor(G.turn,r);
    if(r===6)sfx('six');
    const nm=who(cur());
    if(!G.options.length){
      if(r===6){G.note=`Выпало 6, но ходить некем. ${nm} бросает ещё раз.`;addLog(`${nm}: 6, ходов нет, бросок ещё раз.`);}
      else{const P=cur();const none=!P.pieces.some(p=>p>=0&&p<28);
        G.note=none&&P.pieces.includes(-1)?`Выпало ${r}. Чтобы выставить фишку, нужна шестёрка. Ход переходит дальше.`:`Выпало ${r}, ходить некем. Ход переходит дальше.`;
        addLog(`${nm}: ${r}, ходов нет.`);}
      sync();await wait(1400);
      if(r===6)G.again=true;else nextTurn();
      G.phase='roll';G.note='';sync();
    }else{G.phase='choose';sync();}
  }finally{acting=false;}
  maybeBot();
}
async function apply(opt){
  if(!G||G.phase!=='choose'||!opt)return;
  acting=true;
  try{
    G.phase='busy';SEL=null;
    const P=cur(),nm=who(P);
    if(opt.type==='place'){
      if(P.corner==null){P.corner=opt.corner;addLog(`${nm} выбирает угол ${CORNERS[opt.corner]}.`);}
      capture(opt.cap);P.pieces[opt.n]=0;
      sfx(opt.cap.length?'capture':'step');
      addLog(`${nm}: новая фишка на ${CORNERS[P.corner]}.`);sync();
    }else{
      for(let s=opt.from+1;s<=opt.to;s++){P.pieces[opt.n]=s;sfx('step');sync();await wait(reduced?0:130);}
      capture(opt.cap);
      if(opt.cap.length)sfx('capture');else if(settled(P,opt.to))sfx('home');
      const dest=cname(cellAt(P.corner,opt.to));
      addLog(settled(P,opt.to)?`${nm}: фишка дома на ${dest}.`:`${nm}: ${G.roll}, ход на ${dest}.`);
    }
    if(finished(P)){
      G.places.push(G.turn);
      addLog(`${nm} собрал(а) весь уголок. ${G.places.length}-е место!`);
      if(G.places.length>=G.players.length-1){
        G.players.forEach((_,i)=>{if(!G.places.includes(i))G.places.push(i);});
        G.phase='over';G.options=[];sync();endSound();return;
      }
      nextTurn();
    }else if(G.roll===6)G.again=true;
    else nextTurn();
    G.phase='roll';G.options=[];sync();
  }finally{acting=false;}
  maybeBot();
}
let botTimer=null;
function maybeBot(){
  clearTimeout(botTimer);
  if(NET||!G||G.phase==='over'||!cur().bot)return;
  if(G.phase==='roll')botTimer=setTimeout(()=>doRoll(),800);
  if(G.phase==='choose')botTimer=setTimeout(()=>apply(botPick()),900);
}
function botPick(){
  const P=cur(),hasReserve=P.pieces.includes(-1);
  const score=o=>{
    let s=o.cap.length?100:0;                              // capturing is almost always worth it
    if(o.type==='place')s+=70;                             // get pieces into play
    else{
      if(o.from===0&&hasReserve)s+=60;                     // free the corner so the next six can place again
      if(o.to>=28&&o.from<28)s+=50;                        // reach home
      s+=o.to/10;                                          // otherwise push the leading piece
    }
    return s+Math.random();
  };
  return G.options.slice().sort((a,b)=>score(b)-score(a))[0];
}

// Web Audio: sounds are decoded once and started exactly on cue, so every cell of a move gets its own tap
const SOUND={on:store.get('ugolki-sound')!=='off',ctx:null,buf:{},loading:{},log:null};
const SOUND_NAMES=['dice','six','step','capture','home','turn','win','lose','tap','send','message'];
function audioCtx(){
  if(SOUND.ctx)return SOUND.ctx;
  const C=window.AudioContext||window.webkitAudioContext;
  if(C)SOUND.ctx=new C();
  return SOUND.ctx;
}
function loadSound(name){
  const ctx=audioCtx();if(!ctx)return null;
  if(!SOUND.loading[name])SOUND.loading[name]=fetch('sounds/'+name+'.mp3').then(r=>r.arrayBuffer())
    .then(a=>new Promise((res,rej)=>ctx.decodeAudioData(a,res,rej))).then(b=>{SOUND.buf[name]=b;}).catch(()=>{});
  return SOUND.loading[name];
}
function sfx(name){
  if(!SOUND.on)return;
  if(SOUND.log)SOUND.log.push(name);
  const ctx=audioCtx();if(!ctx)return;
  if(ctx.state==='suspended')ctx.resume().catch(()=>{});
  const b=SOUND.buf[name];
  if(!b){loadSound(name);return;}
  const src=ctx.createBufferSource();src.buffer=b;src.connect(ctx.destination);src.start();
}
SOUND_NAMES.forEach(loadSound);

const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function dieHTML(v){return `<div class="die${v===6?' six':''}" id="die" aria-label="Кубик: ${v||'не брошен'}">${[...Array(9)].map((_,i)=>`<i class="${v&&PIPS[v].includes(i)?'on':''}"></i>`).join('')}</div>`;}
async function animateDie(final){
  sfx('dice');
  const d=document.getElementById('die');
  if(!d||reduced)return;
  d.classList.remove('six');d.classList.add('rolling');
  for(let k=0;k<11;k++){const v=1+Math.floor(Math.random()*6);d.querySelectorAll('i').forEach((p,i)=>p.classList.toggle('on',PIPS[v].includes(i)));await wait(75);}
}

const ico=(c,s)=>`<span class="ico" style="--fill:${c.fill};--edge:${c.edge};--s:${s||20}px"></span>`;
function pieceEl(col){const pc=document.createElement('div');pc.className='pc';pc.style.setProperty('--fill',col.fill);pc.style.setProperty('--edge',col.edge);return pc;}
function makeButton(el,label){el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',label);}

const SHOWCASE=[[2,[[0,7],[1,6],[2,5],[3,4]]],[1,[[7,7],[6,6],[5,5],[4,4]]],[0,[[0,0],[1,1],[2,2],[3,3]]],[3,[[7,0],[6,1],[5,2],[4,3]]]];
function renderBoard(){
  Object.values(cells).forEach(el=>{
    el.classList.remove('home','start','dest','can-place','place-hint','pair');
    el.style.removeProperty('--tint');
    ['data-opt','tabindex','role','aria-label'].forEach(a=>el.removeAttribute(a));el.innerHTML='';
  });
  if(!G){
    SHOWCASE.forEach(([color,list])=>list.forEach(c=>cells[key(c)].appendChild(pieceEl(COLORS[color]))));
    return;
  }
  G.players.forEach(P=>{
    if(P.corner==null)return;
    const col=COLORS[P.color];
    const st=cells[key(CORNER_XY[P.corner])];st.classList.add('start','home');st.style.setProperty('--tint',col.tint);
    diag(P.corner).forEach(c=>{const el=cells[key(c)];el.classList.add('home');el.style.setProperty('--tint',col.tint);});
  });
  const at={};
  G.players.forEach((P,j)=>P.pieces.forEach((pos,n)=>{if(pos<0)return;const k=key(cellAt(P.corner,pos));(at[k]=at[k]||[]).push({j,n});}));
  const human=isMine()&&G.phase==='choose';
  Object.entries(at).forEach(([k,list])=>{
    const el=cells[k];if(list.length>1)el.classList.add('pair');
    list.forEach(({j,n})=>{
      const pc=pieceEl(COLORS[G.players[j].color]);
      if(human&&j===G.turn&&G.options.some(o=>o.type==='move'&&o.n===n)){
        pc.classList.add('can');pc.dataset.n=n;makeButton(pc,'Выбрать фишку');
        if(SEL&&SEL.kind==='piece'&&SEL.n===n)pc.classList.add('sel');
      }
      el.appendChild(pc);
    });
  });
  // corners you could place on: dashed hint right after the roll, pulsing once a reserve piece is picked
  if(human)G.options.forEach(o=>{if(o.type==='place')cells[key(CORNER_XY[o.corner])].classList.add('place-hint');});
  if(human&&SEL)G.options.forEach((o,i)=>{
    const P=cur();
    if(SEL.kind==='reserve'&&o.type==='place'){
      const el=cells[key(CORNER_XY[o.corner])];el.classList.add('can-place');el.dataset.opt=i;makeButton(el,`Поставить фишку на ${CORNERS[o.corner]}`);
    }
    if(SEL.kind==='piece'&&o.type==='move'&&o.n===SEL.n){
      const c=cellAt(P.corner,o.to),el=cells[key(c)];el.classList.add('dest');el.dataset.opt=i;makeButton(el,`Пойти на ${cname(c)}`);
    }
  });
}
const mySeat=()=>NET?NET.seat:Math.max(0,G.players.findIndex(p=>!p.bot));
function renderTray(){
  trayEl.innerHTML='';
  if(!G)return;
  const me=mySeat();
  // your reserve: each piece keeps its own slot, so taking one leaves a dashed gap instead of shuffling the rest
  const P=G.players[me],col=COLORS[P.color];
  const canPlace=isMine()&&G.turn===me&&G.phase==='choose'&&G.options.some(o=>o.type==='place');
  const mine=document.createElement('div');mine.className='tray-mine';
  mine.innerHTML='<span class="tray-lab">Ты</span>';
  const slots=document.createElement('div');slots.className='slots';
  P.pieces.forEach((pos,n)=>{
    if(pos>=0){const sl=document.createElement('span');sl.className='slot';slots.appendChild(sl);return;}
    const pc=pieceEl(col);
    if(canPlace){pc.classList.add('can');pc.dataset.res=n;makeButton(pc,'Взять фишку из запаса');
      if(SEL&&SEL.kind==='reserve'&&SEL.n===n)pc.classList.add('sel');}
    slots.appendChild(pc);
  });
  mine.appendChild(slots);trayEl.appendChild(mine);
  // everyone else, in turn order: four mini slots each, bright while the piece is still in reserve
  const others=G.players.map((Q,i)=>({Q,i})).filter(x=>x.i!==me);
  if(!others.length)return;
  trayEl.insertAdjacentHTML('beforeend',`<div class="tray-others">${others.map(({Q})=>{
    const c=COLORS[Q.color],r=Q.pieces.filter(p=>p<0).length,nm=esc(who(Q));
    return `<div class="orow" aria-label="${nm}: в запасе ${r}"><span class="nm" title="${nm}">${nm}</span><span class="slots">${
      [0,1,2,3].map(k=>`<span class="mini${k<r?'':' out'}" style="--fill:${c.fill};--edge:${c.edge}"></span>`).join('')}</span></div>`;}).join('')}</div>`);
}
function hintText(){
  const P=cur(),nm=esc(who(P));
  if(G.note)return esc(G.note);
  if(!isMine()){
    return G.phase==='choose'?`Выпало <b>${G.roll}</b>. ${nm} делает ход`:`${nm} делает ход`;
  }
  if(G.phase==='roll'||G.phase==='busy'){
    if(G.again)return `Выпала шестёрка: <b>бросай ещё раз</b>.`;
    if(P.corner==null)return `Бросай кубик. На шестёрке выставишь первую фишку на любой свободный угол, он станет твоим.`;
    return P.pieces.some(p=>p>=0)?`Бросай кубик.`:`Бросай кубик. Чтобы выставить фишку на ${CORNERS[P.corner]}, нужна шестёрка.`;
  }
  if(G.phase==='choose'){
    const pl=G.options.some(o=>o.type==='place'),mv=G.options.some(o=>o.type==='move');
    let t=`Выпало <b>${G.roll}</b>. `;
    if(SEL&&SEL.kind==='reserve')t+=P.corner==null?`Выбери угол. Он станет твоим до конца игры.`:`Нажми на свой угол ${CORNERS[P.corner]}.`;
    else if(SEL)t+=`Выбери клетку.`;
    else if(pl&&mv)t+=`Сделай ход или выставь фишку из запаса под доской.`;
    else if(pl)t+=P.corner==null?`Выставь фишку из запаса под доской на любой свободный угол.`:`Выставь фишку из запаса под доской.`;
    else t+=`Сделай ход.`;
    if(!SEL&&G.options.some(o=>o.cap.length))t+=` Есть ход со срубом!`;
    if(G.roll===6)t+=` Потом бросок ещё раз.`;
    return t;
  }
  return '';
}

function renderSide(){
  if(screen!=='game'||!G)sideRest.innerHTML='';
  if(screen==='home')return renderHome();
  if(screen==='join')return renderJoin();
  if(screen==='error')return renderError();
  if(screen==='lobby'||!G)return renderLobby();
  const P=cur(),col=COLORS[P.color];
  const canRoll=G.phase==='roll'&&isMine();
  let top;
  if(G.phase==='over'){
    // result from your seat: 1st = win (green frame), last = lose, anything between = your place
    const me=NET?NET.seat:mySeat(),place=G.places.indexOf(me)+1,last=G.players.length;
    const ORD=['','первом','втором','третьем'];
    const title=place===1?'Игра окончена. Ты выиграл-а! 🎉':place===last?'Игра окончена. Ты проиграл-а! 🥺':`Игра окончена. Ты на ${ORD[place]} месте!`;
    top=`<div class="card result-card${place===1?' win':''}">
      <p class="turn result-title">${title}</p>
      <hr class="rule">
      <div class="players">${G.places.map((i,k)=>{const Q=G.players[i];
        return `<div class="prow">${ico(COLORS[Q.color])}<span class="nm">${esc(who(Q))}</span><span class="st place">${k+1} место</span></div>`;}).join('')}</div>
      ${againButton()}</div>`;
  }else{
    const mine=NET?G.turn===NET.seat:!P.bot;
    top=`<div class="card turn-card${mine?'':' calm'}">
      <div class="turn">${ico(col,24)}${mine?'Твой ход':'Ход: '+esc(who(P))}</div>
      <div class="dice-stack">
        <div class="dice-row">${dieHTML(G.roll)}
          <button class="btn-main" id="roll" ${canRoll?'':'disabled'}>${!mine?esc(who(P))+' бросает кубик':G.again&&canRoll?'Бросить ещё раз':'Бросить кубик'}</button></div>
        <div class="hint" aria-live="polite">${hintText()}</div>
      </div>
    </div>`;
  }
  // turn/result card on top, the chat sits right under it (it lives outside these two blocks), then players, moves, rules
  sideEl.innerHTML=top;
  sideRest.innerHTML=`
    <div class="card"><div class="players">${G.players.map((Q,i)=>{const c=COLORS[Q.color];
      const home=Q.pieces.filter(p=>p>=28).length,on=Q.pieces.filter(p=>p>=0&&p<28).length;const pl=G.places.indexOf(i);
      const done=pl>=0&&G.phase!=='over'&&pl<G.players.length-1; // at the end the places live in the result card
      return `<div class="prow${i===G.turn&&G.phase!=='over'?' active':''}">${ico(c)}
        <span class="nm">${esc(who(Q))}${NET&&i===NET.seat?' (ты)':''}</span>
        <span class="st">${done?`<span class="place">${pl+1} место</span>`:`на поле ${on} · дома ${home}`}</span></div>`;}).join('')}</div></div>
    <details class="card" id="logBox"${openLog?' open':''}><summary>Ходы<span class="chev" aria-hidden="true"></span></summary><ul class="log">${G.log.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></details>
    ${rulesCard()}`;
  bindDetails();
  document.getElementById('roll')?.addEventListener('click',()=>doRoll());
  document.getElementById('again')?.addEventListener('click',()=>{
    if(NET){fb.set(rref('state/rematch/'+NET.seat),true);return;} // online: vote, the new game starts once everyone has
    G=makeState(G.players.map(p=>({name:p.name,bot:p.bot})));SEL=null;render();maybeBot();
  });
}

function netError(err){
  const c=(err&&(err.code||err.message))||'';
  if(c==='notfound')return 'Такой игры нет. Проверь ссылку.';
  if(c==='full')return 'Все места уже заняты.';
  if(/auth\/(admin-restricted|operation-not-allowed|configuration-not-found)/.test(c))return 'Онлайн-режим ещё не включён в настройках сервера (анонимный вход в Firebase).';
  if(/network|Failed to fetch|import/i.test(c))return 'Нет связи с сервером игры. Проверь интернет и попробуй ещё раз.';
  return 'Не удалось подключиться к игре. '+c;
}

function select(sel){
  if(!G||G.phase!=='choose'||!isMine())return;
  const same=SEL&&SEL.kind===sel.kind&&SEL.n===sel.n;
  SEL=same?null:sel;render();
  if(SEL)sfx('step'); // picking a piece up, from the reserve or on the board
}
boardEl.addEventListener('click',e=>{
  if(!G)return;
  const pc=e.target.closest('.pc.can');
  if(pc){select({kind:'piece',n:+pc.dataset.n});return;}
  const t=e.target.closest('[data-opt]');
  if(!t||!isMine())return;
  let o=G.options[+t.dataset.opt];
  // place exactly the reserve piece that was picked
  if(o.type==='place'&&SEL&&SEL.kind==='reserve')o=Object.assign({},o,{n:SEL.n});
  apply(o);
});
trayEl.addEventListener('click',e=>{const t=e.target.closest('[data-res]');if(t)select({kind:'reserve',n:+t.dataset.res});});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute('role')==='button'){e.preventDefault();e.target.click();return;}
  if(e.code==='Space'&&G&&G.phase==='roll'&&isMine()&&!/BUTTON|INPUT/.test(e.target.tagName)){e.preventDefault();doRoll();}
});
// test hook: ugolki.roll(6) forces a die value
window.ugolki={get G(){return G},get NET(){return NET},roll:n=>doRoll(n),apply:i=>apply(G.options[i])};

async function boot(){
  const code=params.get('room');
  if(!code){screen='home';render();return;}
  screen='join';render();
  try{
    const f=await connect();
    joinInfo=await roomInfo(code);
    if(!joinInfo){fatal='Такой игры нет. Проверь ссылку.';screen='error';render();return;}
    const seats=joinInfo.seats||{};
    const mine=Object.keys(seats).find(i=>seats[i]===f.uid);
    if(mine!=null){enterRoom(code,+mine,joinInfo.meta.size);return;} // back after a reload
    render();
  }catch(err){fatal=netError(err);screen='error';render();}
}
boot();
</script>
</body>
